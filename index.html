<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>10 Sec Maths Game</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="index.js"></script>
  </head>

  <script src="index.js"></script>
  <body>
    <div class="container">

      <div class="row">
        <div class="col-xs-12 game">

          <h1>10 Sec Math Game</h1>

          <div class="timerContainer">
            <p id="time-left" class="timer">
              10
            </p>
            <p class="timer-label">
              second(s) left
            </p>
            <p class="score">
              Score: 
              <span id="score">0</span>
            </p>
          </div>

          <p class="high-score">
            High Score: 
            <span id="highScore">0</span>
          </p>

          <p id="equation"></p>

          <label for="user-input" class="sr-only">Your Answer</label>
          <input
            id="user-input"
            type="number"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter your answer"
          />

          <div id="game-over" hidden>
            <h2>Time’s up!</h2>
            <p>Final score: <span id="final-score">0</span></p>
            <button id="restart-button" type="button">Play Again</button>
          </div>

          <div class="row">

            <div class="rangeInput">
              <label for="range">Choose a range from 0 to 50:</label>
              <input id="range" type="range" min="0" max="50" value="10"><p id="rangeValue">10</p>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
